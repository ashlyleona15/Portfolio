<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="Form.css">
    <title>Basic Contact Form</title>
</head>
<body>
    
    <header>
        <h3>AshTech.</h3>
            <nav class="navbar" id="top">
                <ul>
                    <li><a href="homepage.html" target="_self">Home</a></li>
                    <li><a href="project.html" target="_self">Projects</a></li>
                    <li><a href="#" id="openContact">Contact</a></li>
                </ul>
            </nav>
    </header>

    <div id="contactPanel" class="contact-panel">
        <button id="closePanel" class="close-btn">×</button>

        <h2>Get in Touch</h2>

        <div class="contact-info">
            <p><i class="icon">📧</i> ashlyleona15@gmail.com</p>
            <p><i class="icon">📞</i> +63 992 901 0806</p>
            <p><i class="icon">📍</i> Las Piñas, Philippines</p>
        </div>

        <h3>Social Media</h3>
        <div class="social-icons">
            <a href="#"><i>🌐</i></a>
            <a href="#"><i>📘</i></a>
            <a href="#"><i>📸</i></a>
            <a href="#"><i>🎵</i></a>
        </div>
    </div>

    <div>
        <form onsubmit="validate(event)">
            <label for="name">Name</label>
            <input type="text" id="name" required>

            <label for="number">Phone Number</label>
            <input type="tel" id="number" required pattern="[0-9]{11}" placeholder="11-digit number">

            <label for="email">Email</label>
            <input type="email" id="email" required>

            <label for="subject">Subject</label>
            <input type="text" id="subject" required>

            <label for="message">Message</label>
            <textarea id="message" rows="4" required></textarea>

            <button type="submit">Submit</button>
        </form>
    </div>

<script src="Form.js"></script>
</body>
</html>
