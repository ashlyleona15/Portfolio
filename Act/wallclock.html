<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="wallclock.css">
    <title>Aesthetic Wall Clock</title>
</head>
<body>
    
    <header>
        <h3>AshTech.</h3>
            <nav class="navbar" id="top">
                <ul>
                    <li><a href="homepage.html" target="_self">Home</a></li>
                    <li><a href="project.html" target="_self">Projects</a></li>
                    <li><a href="#" id="openContact">Contact</a></li>
                </ul>
            </nav>
    </header>

    <div id="contactPanel" class="contact-panel">
        <button id="closePanel" class="close-btn">×</button>

        <h2>Get in Touch</h2>

        <div class="contact-info">
            <p><i class="icon">📧</i> ashlyleona15@gmail.com</p>
            <p><i class="icon">📞</i> +63 992 901 0806</p>
            <p><i class="icon">📍</i> Las Piñas, Philippines</p>
        </div>

        <h3>Social Media</h3>
        <div class="social-icons">
            <a href="#"><i>🌐</i></a>
            <a href="#"><i>📘</i></a>
            <a href="#"><i>📸</i></a>
            <a href="#"><i>🎵</i></a>
        </div>
    </div>

<div class="clock-wrapper">
    <div class="clock-container">
        <div class="clock">
            <div class="numbers">
                <span style="--i:1">1</span>
                <span style="--i:2">2</span>
                <span style="--i:3">3</span>
                <span style="--i:4">4</span>
                <span style="--i:5">5</span>
                <span style="--i:6">6</span>
                <span style="--i:7">7</span>
                <span style="--i:8">8</span>
                <span style="--i:9">9</span>
                <span style="--i:10">10</span>
                <span style="--i:11">11</span>
                <span style="--i:12">12</span>
            </div>

            <div class="hand hour" id="hourHand"></div>
            <div class="hand minute" id="minuteHand"></div>
            <div class="hand second" id="secondHand"></div>
            <div class="center-point"></div>
        </div>
    </div>
</div>

<script src="wallclock.js"></script>
</body>
</html>
